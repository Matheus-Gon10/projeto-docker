name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python para os testes
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construir a imagem Docker
        run: docker build -t minha-app:ci .

      - name: Iniciar o contêiner
        run: docker run -d --name app -p 5000:5000 minha-app:ci

      - name: Aguardar a aplicação ficar pronta
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://localhost:5000/health > /dev/null; then
              echo "Aplicação pronta"
              exit 0
            fi
            sleep 1
          done
          echo "A aplicação não respondeu a tempo"
          docker logs app
          exit 1

      - name: Instalar dependências de teste
        run: pip install -r requirements-dev.txt

      - name: Executar testes automatizados
        run: pytest -v

      - name: Mostrar logs do contêiner (em caso de falha)
        if: failure()
        run: docker logs app

      - name: Parar o contêiner
        if: always()
        run: docker rm -f app
